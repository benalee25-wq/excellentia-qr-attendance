<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b5039">
<title>Log in – QR Attendance</title>
<style>
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#12263a;
  background:
    linear-gradient(90deg,transparent 0,transparent 46px,rgba(232,163,23,.7) 46px,rgba(232,163,23,.7) 48px,transparent 48px),
    repeating-linear-gradient(180deg,transparent 0,transparent 31px,rgba(255,255,255,.13) 31px,rgba(255,255,255,.13) 32px),
    linear-gradient(160deg,#0b5039,#0f6b4f 60%,#12806a);
  background-attachment:fixed}
.wrap{width:calc(100% - 4.2rem);margin:9vh 1rem 2rem 3.4rem}
@media(min-width:600px){.wrap{width:min(420px,92%);margin:12vh auto 2rem}}
h1{color:#fff;font-size:1.75rem;line-height:1.15;margin:0 0 .3rem}
.tag{color:#f6c453;margin:0 0 1.2rem;font-weight:600}
.card{background:#fff;border-radius:14px;padding:1.2rem;box-shadow:0 12px 32px rgba(0,0,0,.28)}
label{display:block;font-weight:600;margin:.8rem 0 .25rem}
label:first-child{margin-top:0}
input{width:100%;padding:.8rem;border:1px solid #9fb1ab;border-radius:9px;font:inherit;color:#12263a;background:#fff}
input:focus,button:focus-visible{outline:3px solid #e8a317;outline-offset:1px}
button{width:100%;margin-top:1.1rem;padding:.9rem;border:0;border-radius:9px;background:#0f6b4f;color:#fff;font:inherit;font-weight:700;cursor:pointer}
button:hover{background:#0b5039}button:disabled{opacity:.6}
.err{background:#fde7e4;color:#b42318;padding:.7rem;border-radius:9px;margin:.9rem 0 0}
.hide{display:none}
.foot{color:rgba(255,255,255,.8);font-size:.85rem;margin-top:1rem}
</style>
</head>
<body>
<div class="wrap">
  <h1>QR Attendance Register</h1>
  <p class="tag">Scan. Record. Notify. Protect.</p>
  <div class="card">
    <form id="f">
      <label for="email">Email</label>
      <input id="email" type="email" autocomplete="username" required>
      <label for="pw">Password</label>
      <input id="pw" type="password" autocomplete="current-password" required>
      <p id="msg" class="err hide" role="alert"></p>
      <button id="go">Log in</button>
    </form>
  </div>
  <p class="foot">For authorised school staff only. Version P3</p>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script>
const $ = id => document.getElementById(id);
function show(m) { $('msg').textContent = m; $('msg').classList.remove('hide'); }

// This page is self-contained: it needs only config.js and the Supabase script.
const cfg = window.APP_CONFIG || {};
const ok = !!(cfg.SUPABASE_URL && cfg.SUPABASE_ANON_KEY && !/PASTE/.test(cfg.SUPABASE_URL + cfg.SUPABASE_ANON_KEY));
let sb = null;
if (typeof supabase === 'undefined') show('The page could not load its scripts. Check your internet and refresh.');
else if (!ok) show('Setup incomplete: open config.js and paste your Project URL and public key.');
else sb = supabase.createClient(cfg.SUPABASE_URL, cfg.SUPABASE_ANON_KEY);

async function getProfile() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) return { profile: null };
  const { data, error } = await sb.from('user_profiles')
    .select('full_name,role,is_active').eq('id', session.user.id).maybeSingle();
  return { profile: data, error };
}

async function route() {
  const { profile: p, error } = await getProfile();
  if (error) { show('Could not read your account: ' + error.message); return; }
  if (!p) { if ((await sb.auth.getSession()).data.session) { await sb.auth.signOut(); show('Your account has no role yet. Ask the administrator.'); } return; }
  if (p.is_active && p.role === 'admin') { location.href = 'admin/index.html'; return; }
  if (p.is_active && p.role === 'teacher') { location.href = 'teacher/index.html'; return; }
  await sb.auth.signOut();
  show(p.is_active ? 'Your ' + p.role + ' dashboard is coming in a later phase.'
                   : 'This account is switched off. Contact the school administrator.');
}

$('f').onsubmit = async e => {
  e.preventDefault();
  if (!sb) return;
  $('msg').classList.add('hide');
  $('go').disabled = true;
  const { error } = await sb.auth.signInWithPassword({ email: $('email').value.trim(), password: $('pw').value });
  if (error) show('Login failed: ' + error.message);
  else await route();
  $('go').disabled = false;
};

if (sb) route();
</script>
</body>
</html>
